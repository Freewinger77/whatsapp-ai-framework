# Example only. Use Azure Key Vault + External Secrets in real environments.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "wasup-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  WASUP_WORKER_SHARED_SECRET: "replace-me"
  INSTANCE_PROXY_URL: "http://user:pass@proxy.example.com:8080"
  DEFAULT_WEBHOOK_URL: "https://customer.example.com/wasup/webhook"
