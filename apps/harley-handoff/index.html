<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Harley</title>
    <meta name="theme-color" content="#09090b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --line: rgba(63, 63, 70, 0.55);
            --text: #fafafa;
            --muted: #a1a1aa;
            --dim: #71717a;
            --green: #34d399;
            --green-dim: rgba(52, 211, 153, 0.16);
            --amber: #fbbf24;
            --amber-dim: rgba(251, 191, 36, 0.16);
            --red: #f87171;
            --red-dim: rgba(248, 113, 113, 0.14);
            --input: #18181b;
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-t: env(safe-area-inset-top, 0px);
            --dock-h: 76px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Outfit', sans-serif;
            background:
                radial-gradient(900px 420px at 10% -10%, rgba(52, 211, 153, 0.08), transparent 55%),
                radial-gradient(700px 380px at 95% 0%, rgba(251, 191, 36, 0.06), transparent 45%),
                var(--bg);
            color: var(--text);
            min-height: 100dvh;
            font-size: 15px;
            line-height: 1.4;
            padding-bottom: calc(var(--dock-h) + var(--safe-b) + 12px);
            overscroll-behavior-y: contain;
        }
        .wrap { max-width: 820px; margin: 0 auto; padding: calc(18px + var(--safe-t)) 14px 24px; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px; margin-bottom: 16px;
        }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }

        @keyframes flash {
            0% { background: rgba(52, 211, 153, 0.22); }
            100% { background: transparent; }
        }
        @keyframes flash-amber {
            0% { background: rgba(251, 191, 36, 0.22); }
            100% { background: transparent; }
        }
        .row.flash-on { animation: flash 420ms ease-out; }
        .row.flash-off { animation: flash-amber 420ms ease-out; }

        .status-bar {
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            margin-bottom: 16px;
        }
        .pill {
            font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
            padding: 5px 8px; border-radius: 999px;
        }
        .pill.on { background: var(--green-dim); color: var(--green); }
        .pill.off { background: var(--amber-dim); color: var(--amber); }
        .status-bar .spacer { flex: 1; min-width: 4px; }

        button {
            border: 0; border-radius: 12px; padding: 12px 14px; font: inherit; font-weight: 700;
            cursor: pointer; white-space: nowrap; min-height: 48px; touch-action: manipulation;
            -webkit-tap-highlight-color: transparent; user-select: none;
            transition: transform 80ms ease, opacity 120ms ease;
        }
        button:active:not(:disabled) { transform: scale(0.97); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.busy { opacity: 0.7; }
        .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); min-height: 40px; padding: 8px 12px; font-weight: 600; }
        .btn-pause { background: var(--amber-dim); color: var(--amber); min-width: 96px; }
        .btn-resume { background: var(--green-dim); color: var(--green); min-width: 96px; }
        .btn-danger { background: var(--red-dim); color: var(--red); }

        section { margin-bottom: 20px; }
        .count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }

        .list {
            border: 1px solid var(--line); border-radius: 14px;
            background: rgba(18, 18, 20, 0.72); overflow: hidden;
        }
        .row {
            display: grid; grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px; align-items: center; padding: 12px;
            border-bottom: 1px solid var(--line); min-height: 64px;
        }
        .row:last-child { border-bottom: 0; }
        .phone { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
        .phone a { color: inherit; text-decoration: none; }
        .detail { color: var(--dim); font-size: 12px; margin-top: 3px; }
        .detail span + span::before { content: '·'; margin: 0 6px; }
        .badge {
            display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
            text-transform: uppercase; padding: 3px 7px; border-radius: 999px; margin-left: 6px;
            vertical-align: middle;
        }
        .badge.paused { background: var(--amber-dim); color: var(--amber); }
        .actions { display: flex; gap: 8px; align-items: center; }
        .empty { padding: 24px 14px; text-align: center; color: var(--dim); font-size: 13px; }

        .error {
            display: none; background: var(--red-dim); color: var(--red);
            border: 1px solid rgba(248, 113, 113, 0.25);
            border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px;
        }
        .error.show { display: block; }
        .auth-row { display: none; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 12px; }
        .auth-row.show { display: grid; }

        input[type="text"], input[type="password"], input[type="tel"] {
            width: 100%; background: var(--input); border: 1px solid var(--line); color: var(--text);
            border-radius: 12px; padding: 12px 14px; font: inherit; outline: none; min-height: 48px;
            font-size: 16px;
        }
        input:focus { border-color: rgba(52, 211, 153, 0.55); }

        .compose-field { position: relative; min-width: 0; }

        .suggest {
            display: none;
            position: absolute; left: 0; right: 0; z-index: 45;
            border: 1px solid var(--line); border-radius: 12px;
            background: #141416; overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.55);
            max-height: 240px; overflow-y: auto;
        }
        .suggest.show { display: block; }
        .suggest.above { bottom: calc(100% + 6px); }
        .suggest.below { top: calc(100% + 6px); }
        .suggest-item {
            width: 100%; min-height: 48px; border-radius: 0; text-align: left;
            background: transparent; color: var(--text); font-weight: 500;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 10px 14px; border-bottom: 1px solid var(--line);
        }
        .suggest-item:last-child { border-bottom: 0; }
        .suggest-item:active, .suggest-item.active { background: rgba(52, 211, 153, 0.1); }
        .suggest-item .num { font-family: 'JetBrains Mono', monospace; font-size: 15px; }
        .suggest-item .hint { color: var(--dim); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

        .dock {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
            padding: 10px 14px calc(10px + var(--safe-b));
            background: linear-gradient(to top, rgba(9, 9, 11, 0.97) 60%, rgba(9, 9, 11, 0.85));
            border-top: 1px solid var(--line);
            backdrop-filter: blur(10px);
        }
        .dock-inner {
            max-width: 820px; margin: 0 auto;
            display: grid; grid-template-columns: 1fr auto; gap: 8px;
        }

        .toast {
            position: fixed; left: 50%; top: calc(12px + var(--safe-t));
            transform: translateX(-50%) translateY(-120%);
            z-index: 50; pointer-events: none;
            background: #18181b; color: var(--text); border: 1px solid var(--line);
            border-radius: 999px; padding: 10px 16px; font-size: 13px; font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
            transition: transform 180ms ease, opacity 180ms ease;
            opacity: 0; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.ok { border-color: rgba(52, 211, 153, 0.35); color: var(--green); }
        .toast.warn { border-color: rgba(251, 191, 36, 0.35); color: var(--amber); }

        .tabs {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
            margin-bottom: 12px; padding: 4px; border: 1px solid var(--line);
            border-radius: 12px; background: rgba(18, 18, 20, 0.6);
        }
        .tab {
            min-height: 40px; border-radius: 10px; background: transparent; color: var(--muted);
            font-weight: 600; font-size: 13px;
        }
        .tab.active { background: rgba(52, 211, 153, 0.12); color: var(--green); }
        .panel[hidden] { display: none !important; }

        .compose-desktop { display: none; }

        @media (min-width: 720px) {
            .wrap { padding: 28px 20px 40px; }
            body { padding-bottom: 28px; }
            .dock { display: none; }
            h1 { font-size: 30px; }
            .compose-desktop {
                display: grid !important; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="wrap">
        <header>
            <h1>Harley</h1>
            <button class="btn-danger" id="ai-toggle" type="button">AI off</button>
        </header>

        <div class="error" id="error"></div>
        <div class="auth-row" id="auth-row">
            <input type="password" id="api-key" placeholder="API key (if required)" autocomplete="off">
            <button class="btn-ghost" id="save-key" type="button">Save</button>
        </div>

        <div class="status-bar">
            <span class="pill" id="ai-pill">…</span>
            <span class="spacer"></span>
        </div>

        <section class="compose-desktop" aria-label="Pause a number">
            <div class="compose-field">
                <input type="tel" id="phone-input-desktop" placeholder="07… or 020…" autocomplete="off" inputmode="tel">
                <div class="suggest below" id="suggest-desktop"></div>
            </div>
            <button class="btn-pause" id="pause-btn-desktop" type="button">Pause</button>
        </section>

        <div class="tabs" role="tablist">
            <button class="tab active" type="button" data-tab="paused" id="tab-paused">Paused <span class="count" id="paused-count">0</span></button>
            <button class="tab" type="button" data-tab="recent" id="tab-recent">Recent <span class="count" id="recent-count">0</span></button>
        </div>

        <section class="panel" id="panel-paused">
            <div class="list" id="paused-list"><div class="empty">Loading…</div></div>
            <div style="margin-top:10px;display:flex;justify-content:flex-end;">
                <button class="btn-danger" id="clear-all" type="button" disabled>Resume all</button>
            </div>
        </section>

        <section class="panel" id="panel-recent" hidden>
            <div class="list" id="recent-list"><div class="empty">Waiting…</div></div>
        </section>
    </div>

    <div class="dock" aria-label="Quick pause">
        <div class="dock-inner">
            <div class="compose-field">
                <input type="tel" id="phone-input" placeholder="07… or 020…" autocomplete="off" inputmode="tel">
                <div class="suggest above" id="suggest-mobile"></div>
            </div>
            <button class="btn-pause" id="pause-btn" type="button">Pause</button>
        </div>
    </div>

    <script>
        const API_BASE = 'https://wasup2.northeurope.cloudapp.azure.com';
        const INSTANCE_ID = 'wa_ms4nkrz1_gg1rx';
        const HARLEY_WEBHOOK = 'https://n8n-rapid-czbff9cnafhkhmhf.eastus-01.azurewebsites.net/webhook/harley-st';
        const API_KEY_STORAGE_KEY = 'wasup_api_key';
        const FAST_MS = 2500;
        const SLOW_MS = 12000;

        const el = {
            toast: document.getElementById('toast'),
            error: document.getElementById('error'),
            authRow: document.getElementById('auth-row'),
            apiKey: document.getElementById('api-key'),
            saveKey: document.getElementById('save-key'),
            aiPill: document.getElementById('ai-pill'),
            aiToggle: document.getElementById('ai-toggle'),
            pausedList: document.getElementById('paused-list'),
            pausedCount: document.getElementById('paused-count'),
            recentList: document.getElementById('recent-list'),
            recentCount: document.getElementById('recent-count'),
            phoneInput: document.getElementById('phone-input'),
            phoneInputDesktop: document.getElementById('phone-input-desktop'),
            pauseBtn: document.getElementById('pause-btn'),
            pauseBtnDesktop: document.getElementById('pause-btn-desktop'),
            suggestMobile: document.getElementById('suggest-mobile'),
            suggestDesktop: document.getElementById('suggest-desktop'),
            clearAll: document.getElementById('clear-all'),
            panelPaused: document.getElementById('panel-paused'),
            panelRecent: document.getElementById('panel-recent'),
            tabPaused: document.getElementById('tab-paused'),
            tabRecent: document.getElementById('tab-recent'),
        };

        let paused = [];
        let recent = [];
        let aiOn = false;
        let refreshInFlight = false;
        let recentInFlight = false;
        let pending = new Set();
        let optimisticActive = new Map();
        let flashPhone = null;
        let flashKind = null;
        let fastTimer = null;
        let slowTimer = null;
        let toastTimer = null;
        let activeSuggest = null; // { box, items, index, input }

        function getApiKey() {
            try { return localStorage.getItem(API_KEY_STORAGE_KEY) || ''; } catch (_) { return ''; }
        }
        function setApiKey(v) {
            try {
                if (v) localStorage.setItem(API_KEY_STORAGE_KEY, v);
                else localStorage.removeItem(API_KEY_STORAGE_KEY);
            } catch (_) {}
        }
        function headers(json = false) {
            const h = {};
            if (json) h['Content-Type'] = 'application/json';
            const key = getApiKey();
            if (key) h['X-API-Key'] = key;
            return h;
        }
        function buzz(ms = 12) {
            try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {}
        }
        function toast(msg, kind = 'ok') {
            el.toast.textContent = msg;
            el.toast.className = `toast show ${kind}`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.toast.className = 'toast'; }, 1400);
        }
        function showError(msg) {
            if (!msg) { el.error.classList.remove('show'); el.error.textContent = ''; return; }
            el.error.textContent = msg;
            el.error.classList.add('show');
        }
        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        /** Digits-only international (no +). UK locals 07… / 020… → 44… */
        function normalizePhone(raw) {
            if (!raw) return '';
            let s = String(raw).trim();

            const jid = s.match(/^(\d{6,18})@(?:s\.whatsapp\.net|lid|c\.us)\b/i);
            if (jid) return canonicalizeUk(jid[1]);

            const link = s.match(/(?:wa\.me\/|phone=)(\+?\d[\d\s().\-]{6,20}\d)/i);
            if (link) s = link[1];

            s = s.replace(/^[+]/, '');
            // keep leading 0 for UK local detection before stripping non-digits carefully
            let digits = s.replace(/[^\d]/g, '');
            if (!digits) return '';

            // 0044…
            if (digits.startsWith('0044')) digits = digits.slice(2);

            // UK local national: 07… / 01… / 02… / 03… (10–11 digits)
            if (digits.startsWith('0') && digits.length >= 10 && digits.length <= 11) {
                digits = '44' + digits.slice(1);
            }

            // bare UK mobile without 0: 7xxxxxxxxx (10 digits) → 447…
            if (/^7\d{9}$/.test(digits)) digits = '44' + digits;

            // London without 0: 20xxxxxxxx
            if (/^20\d{8}$/.test(digits)) digits = '44' + digits;

            if (digits.length < 8 || digits.length > 15) return '';
            return digits;
        }

        function canonicalizeUk(digits) {
            let d = String(digits || '').replace(/\D/g, '');
            if (d.startsWith('0044')) d = d.slice(2);
            if (d.startsWith('0') && d.length >= 10 && d.length <= 11) d = '44' + d.slice(1);
            if (/^7\d{9}$/.test(d)) d = '44' + d;
            if (/^20\d{8}$/.test(d)) d = '44' + d;
            return d;
        }

        /** Display UK numbers as 07… / 020… — API still gets 447… */
        function formatPhone(raw) {
            const d = normalizePhone(raw);
            if (!d) return String(raw || '').trim() || '—';

            if (d.startsWith('44') && d.length >= 11) {
                const national = '0' + d.slice(2);

                // Mobile 07xxx xxx xxx
                if (/^07\d{9}$/.test(national)) {
                    return `${national.slice(0, 5)} ${national.slice(5, 8)} ${national.slice(8)}`;
                }

                // London 020 xxxx xxxx
                if (/^020\d{8}$/.test(national)) {
                    return `${national.slice(0, 3)} ${national.slice(3, 7)} ${national.slice(7)}`;
                }

                // 01xxx / 02xxx / 03xxx landlines — common 5+6 or 4+3+4
                if (/^0[123]\d{8,9}$/.test(national)) {
                    if (national.length === 11 && /^(011|01\d1)/.test(national)) {
                        return `${national.slice(0, 4)} ${national.slice(4, 7)} ${national.slice(7)}`;
                    }
                    if (national.length === 11) {
                        return `${national.slice(0, 5)} ${national.slice(5)}`;
                    }
                    if (national.length === 10) {
                        return `${national.slice(0, 4)} ${national.slice(4)}`;
                    }
                }

                // fallback national with light grouping
                return national.replace(/(\d{4})(\d{3})(\d+)/, '$1 $2 $3');
            }

            if (d.startsWith('1') && d.length === 11) {
                return `+1 (${d.slice(1, 4)}) ${d.slice(4, 7)}-${d.slice(7)}`;
            }
            const m = d.match(/^(\d{1,3})(\d+)$/);
            if (!m) return `+${d}`;
            return `+${m[1]} ${(m[2].match(/.{1,4}/g) || [m[2]]).join(' ')}`;
        }

        function matchKey(phone) {
            const d = normalizePhone(phone);
            const uk = formatPhone(d).replace(/\s/g, '');
            return {
                d,
                digits: d,
                ukDigits: uk.replace(/\D/g, ''),
                display: formatPhone(d),
            };
        }

        function extractPhonesFromText(text) {
            const found = new Set();
            if (!text) return found;
            const re = /(\+?\d[\d\s().\-]{6,18}\d)(?:@(?:s\.whatsapp\.net|lid|c\.us))?/gi;
            let m;
            while ((m = re.exec(text)) !== null) {
                const n = normalizePhone(m[1]);
                if (n) found.add(n);
            }
            const jidRe = /\b(\d{8,15})@(?:s\.whatsapp\.net|lid|c\.us)\b/gi;
            while ((m = jidRe.exec(text)) !== null) {
                const n = normalizePhone(m[1]);
                if (n) found.add(n);
            }
            return found;
        }

        function relativeTime(iso) {
            if (!iso) return '';
            const sec = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
            if (Number.isNaN(sec)) return '';
            if (sec < 10) return 'just now';
            if (sec < 60) return `${sec}s ago`;
            if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
            if (sec < 86400) return `${Math.floor(sec / 3600)}h ago`;
            return `${Math.floor(sec / 86400)}d ago`;
        }
        function isPaused(phone) {
            return paused.some((c) => normalizePhone(c.phone || c.jid) === phone);
        }

        async function api(path, options = {}) {
            const res = await fetch(`${API_BASE}${path}`, {
                ...options,
                headers: { ...headers(!!options.body), ...(options.headers || {}) },
            });
            let data = null;
            try { data = await res.json(); } catch (_) {}
            if (!res.ok) {
                const err = new Error(data?.message || data?.error || `${res.status} ${res.statusText}`);
                err.status = res.status;
                throw err;
            }
            return data;
        }

        function setTab(name) {
            const pausedTab = name === 'paused';
            el.tabPaused.classList.toggle('active', pausedTab);
            el.tabRecent.classList.toggle('active', !pausedTab);
            el.panelPaused.hidden = !pausedTab;
            el.panelRecent.hidden = pausedTab;
        }

        function renderStatus() {
            el.aiPill.textContent = aiOn ? 'AI on' : 'AI off';
            el.aiPill.className = `pill ${aiOn ? 'on' : 'off'}`;
            el.aiToggle.textContent = aiOn ? 'AI off' : 'AI on';
            el.aiToggle.className = aiOn ? 'btn-danger' : 'btn-resume';
        }

        function actionButton(phone, pausedNow) {
            const busy = pending.has(phone) ? ' busy' : '';
            const disabled = pending.has(phone) ? ' disabled' : '';
            if (pausedNow) {
                return `<button class="btn-resume${busy}" data-resume="${escapeHtml(phone)}" type="button"${disabled}>Resume</button>`;
            }
            return `<button class="btn-pause${busy}" data-pause="${escapeHtml(phone)}" type="button"${disabled}>Pause</button>`;
        }

        function renderPaused() {
            const rows = paused.map((chat) => ({
                phone: normalizePhone(chat.phone || chat.jid),
                taggedAt: chat.taggedAt,
                taggedBy: chat.taggedBy,
                lastActivity: chat.lastActivity,
            })).filter((r) => r.phone)
              .sort((a, b) => new Date(b.lastActivity || b.taggedAt || 0) - new Date(a.lastActivity || a.taggedAt || 0));

            el.pausedCount.textContent = String(rows.length);
            el.clearAll.disabled = rows.length === 0 || pending.size > 0;
            if (!rows.length) {
                el.pausedList.innerHTML = '<div class="empty">Nobody paused</div>';
                return;
            }
            el.pausedList.innerHTML = rows.map((r) => {
                const flash = flashPhone === r.phone ? (flashKind === 'pause' ? ' flash-off' : ' flash-on') : '';
                return `
                <div class="row${flash}" data-phone="${escapeHtml(r.phone)}">
                    <div>
                        <div class="phone">
                            <a href="https://wa.me/${r.phone}" target="_blank" rel="noopener">${escapeHtml(formatPhone(r.phone))}</a>
                            <span class="badge paused">Paused</span>
                        </div>
                        <div class="detail">
                            <span>${escapeHtml(r.taggedBy || 'handoff')}</span>
                            <span>${escapeHtml(relativeTime(r.lastActivity || r.taggedAt) || '—')}</span>
                        </div>
                    </div>
                    <div class="actions">${actionButton(r.phone, true)}</div>
                </div>`;
            }).join('');
        }

        function renderRecent() {
            el.recentCount.textContent = String(recent.length);
            if (!recent.length) {
                el.recentList.innerHTML = '<div class="empty">No recent numbers yet</div>';
                return;
            }
            el.recentList.innerHTML = recent.map((r) => {
                const pausedNow = isPaused(r.phone);
                const flash = flashPhone === r.phone ? (flashKind === 'pause' ? ' flash-off' : ' flash-on') : '';
                return `
                <div class="row${flash}" data-phone="${escapeHtml(r.phone)}">
                    <div>
                        <div class="phone">
                            <a href="https://wa.me/${r.phone}" target="_blank" rel="noopener">${escapeHtml(formatPhone(r.phone))}</a>
                            ${pausedNow ? '<span class="badge paused">Paused</span>' : ''}
                        </div>
                        <div class="detail">
                            <span>${escapeHtml(r.hint || 'chat')}</span>
                            <span>${escapeHtml(relativeTime(r.at) || '—')}</span>
                        </div>
                    </div>
                    <div class="actions">${actionButton(r.phone, pausedNow)}</div>
                </div>`;
            }).join('');
        }

        function paint() {
            renderPaused();
            renderRecent();
            // refresh open suggestions if typing
            if (document.activeElement === el.phoneInput) updateSuggestions(el.phoneInput, el.suggestMobile);
            if (document.activeElement === el.phoneInputDesktop) updateSuggestions(el.phoneInputDesktop, el.suggestDesktop);
        }

        function suggestionPool() {
            const map = new Map();
            for (const r of recent) {
                const n = normalizePhone(r.phone);
                if (!n) continue;
                map.set(n, { phone: n, hint: isPaused(n) ? 'paused' : (r.hint || 'recent'), at: r.at });
            }
            for (const c of paused) {
                const n = normalizePhone(c.phone || c.jid);
                if (!n) continue;
                const prev = map.get(n);
                map.set(n, {
                    phone: n,
                    hint: 'paused',
                    at: c.lastActivity || c.taggedAt || prev?.at,
                });
            }
            return [...map.values()].sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0));
        }

        function filterSuggestions(query) {
            const qRaw = String(query || '').trim();
            if (!qRaw) return suggestionPool().slice(0, 6);
            const qDigits = qRaw.replace(/\D/g, '');
            const qNorm = normalizePhone(qRaw);
            return suggestionPool().filter((item) => {
                const m = matchKey(item.phone);
                if (qNorm && m.digits === qNorm) return true;
                if (qDigits && (m.digits.includes(qDigits) || m.ukDigits.includes(qDigits))) return true;
                const disp = m.display.replace(/\s/g, '').toLowerCase();
                if (disp.includes(qRaw.replace(/\s/g, '').toLowerCase())) return true;
                return false;
            }).slice(0, 8);
        }

        function hideSuggestions(box) {
            if (!box) {
                el.suggestMobile.classList.remove('show');
                el.suggestDesktop.classList.remove('show');
                activeSuggest = null;
                return;
            }
            box.classList.remove('show');
            box.innerHTML = '';
            if (activeSuggest?.box === box) activeSuggest = null;
        }

        function updateSuggestions(input, box) {
            const items = filterSuggestions(input.value);
            if (!items.length) {
                hideSuggestions(box);
                return;
            }
            box.innerHTML = items.map((item, idx) => `
                <button type="button" class="suggest-item${idx === 0 ? ' active' : ''}" data-suggest="${escapeHtml(item.phone)}">
                    <span class="num">${escapeHtml(formatPhone(item.phone))}</span>
                    <span class="hint">${escapeHtml(item.hint || 'recent')}</span>
                </button>
            `).join('');
            box.classList.add('show');
            activeSuggest = { box, items, index: 0, input };
        }

        function pickSuggestion(phone, input) {
            hideSuggestions();
            input.value = formatPhone(phone);
            setHandoff(phone, true);
            input.blur();
        }

        async function loadRecent() {
            if (recentInFlight) return recent;
            recentInFlight = true;
            try {
                const seen = new Map();
                const absorb = (phone, at, hint) => {
                    const n = normalizePhone(phone);
                    if (!n || n.length < 8) return;
                    const ts = at ? new Date(at).getTime() : 0;
                    const prev = seen.get(n);
                    if (prev && prev._ts >= ts) return;
                    seen.set(n, { phone: n, at, hint, _ts: ts });
                };
                const [msgData, logData] = await Promise.all([
                    api(`/api/instances/${INSTANCE_ID}/messages?limit=60`).catch(() => ({ messages: [] })),
                    api(`/api/instances/${INSTANCE_ID}/logs?limit=80`).catch(() => ({ logs: [] })),
                ]);
                for (const m of msgData.messages || []) {
                    absorb(m.direction === 'outbound' ? m.to : m.from, m.timestamp, m.direction || 'chat');
                }
                for (const entry of logData.logs || []) {
                    const msg = entry.message || '';
                    let hint = 'log';
                    if (/handoff/i.test(msg)) hint = 'handoff';
                    else if (/replied to/i.test(msg)) hint = 'reply';
                    for (const p of extractPhonesFromText(msg)) absorb(p, entry.timestamp, hint);
                }
                recent = [...seen.values()].sort((a, b) => b._ts - a._ts).slice(0, 36).map(({ _ts, ...r }) => r);
                return recent;
            } finally {
                recentInFlight = false;
            }
        }

        async function refresh({ includeRecent = false, quiet = false } = {}) {
            if (refreshInFlight) return;
            refreshInFlight = true;
            try {
                if (!quiet) showError('');
                const [list, ho] = await Promise.all([
                    api('/api/instances'),
                    api(`/api/instances/${INSTANCE_ID}/handoff`),
                ]);
                const inst = (list.instances || []).find((i) => i.id === INSTANCE_ID) || null;
                if (!inst) throw new Error('Harley not found');
                aiOn = !!(inst.webhookUrl);
                renderStatus();

                const serverPaused = ho.humanModeChats || [];
                const pendingPhones = [...pending];
                paused = serverPaused.filter((c) => {
                    const p = normalizePhone(c.phone || c.jid);
                    return !pendingPhones.includes(p);
                });
                for (const p of pendingPhones) {
                    if (optimisticActive.get(p) && !paused.some((c) => normalizePhone(c.phone || c.jid) === p)) {
                        paused.unshift({
                            jid: `${p}@s.whatsapp.net`,
                            phone: p,
                            taggedAt: new Date().toISOString(),
                            taggedBy: 'you',
                            lastActivity: new Date().toISOString(),
                        });
                    }
                }

                if (includeRecent) await loadRecent();
                paint();
            } catch (err) {
                if (err.status === 401) {
                    el.authRow.classList.add('show');
                    if (!quiet) showError('API key required.');
                } else if (!quiet) {
                    showError(err.message || 'Refresh failed');
                }
            } finally {
                refreshInFlight = false;
            }
        }

        async function setHandoff(phone, active) {
            const n = normalizePhone(phone);
            if (!n) { showError('Could not parse that number'); buzz(30); return; }
            if (pending.has(n)) return;

            const prevPaused = paused.map((c) => ({ ...c }));
            pending.add(n);
            optimisticActive.set(n, active);
            flashPhone = n;
            flashKind = active ? 'pause' : 'resume';
            buzz(active ? 10 : 16);

            if (active) {
                if (!isPaused(n)) {
                    paused.unshift({
                        jid: `${n}@s.whatsapp.net`,
                        phone: n,
                        taggedAt: new Date().toISOString(),
                        taggedBy: 'you',
                        lastActivity: new Date().toISOString(),
                    });
                }
                if (!recent.some((r) => r.phone === n)) {
                    recent.unshift({ phone: n, at: new Date().toISOString(), hint: 'manual' });
                }
                toast(`Paused ${formatPhone(n)}`, 'warn');
                setTab('paused');
            } else {
                paused = paused.filter((c) => normalizePhone(c.phone || c.jid) !== n);
                toast(`Resumed ${formatPhone(n)}`, 'ok');
            }
            paint();
            setTimeout(() => { flashPhone = null; flashKind = null; }, 450);

            try {
                showError('');
                await api(`/api/instances/${INSTANCE_ID}/handoff`, {
                    method: 'POST',
                    body: JSON.stringify({ phone: n, active: !!active }),
                });
            } catch (err) {
                paused = prevPaused;
                paint();
                showError(err.message || 'Update failed');
                toast('Failed — undone', 'warn');
                buzz([20, 40, 20]);
            } finally {
                pending.delete(n);
                optimisticActive.delete(n);
                refresh({ quiet: true }).catch(() => {});
            }
        }

        async function toggleAi() {
            try {
                showError('');
                const nextOn = !aiOn;
                if (!nextOn && !confirm('Turn AI off for Harley?')) return;
                aiOn = nextOn;
                renderStatus();
                toast(aiOn ? 'AI on' : 'AI off', aiOn ? 'ok' : 'warn');
                buzz(14);
                await api(`/api/instances/${INSTANCE_ID}`, {
                    method: 'PUT',
                    body: JSON.stringify({ webhookUrl: aiOn ? HARLEY_WEBHOOK : '' }),
                });
                refresh({ quiet: true });
            } catch (err) {
                showError(err.message || 'AI toggle failed');
                refresh({ quiet: true });
            }
        }

        function pauseFromInput(inputEl) {
            if (activeSuggest?.items?.length && activeSuggest.input === inputEl && activeSuggest.index >= 0) {
                const phone = activeSuggest.items[activeSuggest.index]?.phone;
                if (phone) {
                    pickSuggestion(phone, inputEl);
                    return;
                }
            }
            const v = inputEl.value;
            inputEl.value = '';
            hideSuggestions();
            setHandoff(v, true);
        }

        function wireSuggest(input, box) {
            input.addEventListener('input', () => updateSuggestions(input, box));
            input.addEventListener('focus', () => updateSuggestions(input, box));
            input.addEventListener('blur', () => {
                // allow tap on suggestion
                setTimeout(() => {
                    if (!box.contains(document.activeElement)) hideSuggestions(box);
                }, 140);
            });
            input.addEventListener('keydown', (e) => {
                if (!activeSuggest || activeSuggest.box !== box || !activeSuggest.items.length) {
                    if (e.key === 'Enter') { e.preventDefault(); pauseFromInput(input); }
                    return;
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    activeSuggest.index = Math.min(activeSuggest.index + 1, activeSuggest.items.length - 1);
                    [...box.querySelectorAll('.suggest-item')].forEach((n, i) => n.classList.toggle('active', i === activeSuggest.index));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    activeSuggest.index = Math.max(activeSuggest.index - 1, 0);
                    [...box.querySelectorAll('.suggest-item')].forEach((n, i) => n.classList.toggle('active', i === activeSuggest.index));
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const phone = activeSuggest.items[activeSuggest.index]?.phone;
                    if (phone) pickSuggestion(phone, input);
                    else pauseFromInput(input);
                } else if (e.key === 'Escape') {
                    hideSuggestions(box);
                }
            });
            box.addEventListener('mousedown', (e) => e.preventDefault());
            box.addEventListener('click', (e) => {
                const item = e.target.closest('[data-suggest]');
                if (!item) return;
                pickSuggestion(item.getAttribute('data-suggest'), input);
            });
        }

        el.apiKey.value = getApiKey();
        el.saveKey.addEventListener('click', () => { setApiKey(el.apiKey.value.trim()); showError(''); refresh({ includeRecent: true }); });
        el.aiToggle.addEventListener('click', () => toggleAi());
        el.clearAll.addEventListener('click', async () => {
            if (!confirm('Resume AI for every paused chat?')) return;
            const prev = paused.map((c) => ({ ...c }));
            paused = [];
            paint();
            toast('Resumed all', 'ok');
            buzz(18);
            try {
                await api(`/api/instances/${INSTANCE_ID}/handoff`, { method: 'DELETE' });
                refresh({ quiet: true });
            } catch (err) {
                paused = prev;
                paint();
                showError(err.message || 'Clear failed');
            }
        });

        el.pauseBtn.addEventListener('click', () => pauseFromInput(el.phoneInput));
        el.pauseBtnDesktop.addEventListener('click', () => pauseFromInput(el.phoneInputDesktop));
        wireSuggest(el.phoneInput, el.suggestMobile);
        wireSuggest(el.phoneInputDesktop, el.suggestDesktop);

        el.tabPaused.addEventListener('click', () => setTab('paused'));
        el.tabRecent.addEventListener('click', () => { setTab('recent'); if (!recent.length) loadRecent().then(paint); });

        document.addEventListener('click', (e) => {
            const resume = e.target.closest('[data-resume]');
            if (resume) { e.preventDefault(); setHandoff(resume.getAttribute('data-resume'), false); return; }
            const pause = e.target.closest('[data-pause]');
            if (pause) { e.preventDefault(); setHandoff(pause.getAttribute('data-pause'), true); }
        });

        function startTimers() {
            stopTimers();
            fastTimer = setInterval(() => refresh({ quiet: true }), FAST_MS);
            slowTimer = setInterval(() => refresh({ includeRecent: true, quiet: true }), SLOW_MS);
        }
        function stopTimers() {
            if (fastTimer) clearInterval(fastTimer);
            if (slowTimer) clearInterval(slowTimer);
            fastTimer = slowTimer = null;
        }

        refresh({ includeRecent: true }).then(startTimers);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) stopTimers();
            else {
                refresh({ includeRecent: true, quiet: true });
                startTimers();
            }
        });
    </script>
</body>
</html>
