<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harley — live handoffs</title>
    <meta name="theme-color" content="#09090b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --line: rgba(63, 63, 70, 0.55);
            --text: #fafafa;
            --muted: #a1a1aa;
            --dim: #71717a;
            --green: #34d399;
            --green-dim: rgba(52, 211, 153, 0.12);
            --amber: #fbbf24;
            --amber-dim: rgba(251, 191, 36, 0.12);
            --red: #f87171;
            --red-dim: rgba(248, 113, 113, 0.12);
            --input: #18181b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background:
                radial-gradient(900px 420px at 10% -10%, rgba(52, 211, 153, 0.08), transparent 55%),
                radial-gradient(700px 380px at 95% 0%, rgba(251, 191, 36, 0.06), transparent 45%),
                var(--bg);
            color: var(--text);
            min-height: 100dvh;
            font-size: 14px;
            line-height: 1.45;
        }
        .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 64px; }
        header { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
        .brand { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); font-weight: 600; margin-bottom: 6px; }
        h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
        .sub { color: var(--muted); margin-top: 4px; }
        .meta { text-align: right; color: var(--dim); font-size: 12px; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .live { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-weight: 500; }
        .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.8s ease-out infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.45); }
            70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }
        .status-bar {
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            margin-bottom: 20px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
            background: rgba(18, 18, 20, 0.7);
        }
        .pill {
            font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
            padding: 4px 8px; border-radius: 999px;
        }
        .pill.on { background: var(--green-dim); color: var(--green); }
        .pill.off { background: var(--amber-dim); color: var(--amber); }
        .pill.conn { background: var(--green-dim); color: var(--green); }
        .pill.down { background: var(--red-dim); color: var(--red); }
        .status-bar .detail { color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
        .status-bar .spacer { flex: 1; }
        button {
            border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
        .btn-ghost:hover:not(:disabled) { color: var(--text); }
        .btn-pause { background: var(--amber-dim); color: var(--amber); }
        .btn-resume { background: var(--green-dim); color: var(--green); }
        .btn-danger { background: var(--red-dim); color: var(--red); }
        section { margin-bottom: 26px; }
        .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
        .section-head h2 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
        .count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
        .list { border: 1px solid var(--line); border-radius: 14px; background: rgba(18, 18, 20, 0.72); overflow: hidden; }
        .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
        .row:last-child { border-bottom: 0; }
        .phone { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; }
        .phone a { color: inherit; text-decoration: none; }
        .phone a:hover { color: var(--green); }
        .detail { color: var(--dim); font-size: 12px; margin-top: 3px; }
        .detail span + span::before { content: '·'; margin: 0 6px; }
        .badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; margin-left: 8px; }
        .badge.paused { background: var(--amber-dim); color: var(--amber); }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .empty { padding: 28px 16px; text-align: center; color: var(--dim); }
        .compose { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
        input[type="text"], input[type="password"] {
            width: 100%; background: var(--input); border: 1px solid var(--line); color: var(--text);
            border-radius: 10px; padding: 11px 12px; font: inherit; outline: none;
        }
        input:focus { border-color: rgba(52, 211, 153, 0.55); }
        .error {
            display: none; background: var(--red-dim); color: var(--red); border: 1px solid rgba(248, 113, 113, 0.25);
            border-radius: 10px; padding: 10px 12px; margin-bottom: 16px;
        }
        .error.show { display: block; }
        .auth-row { display: none; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 16px; }
        .auth-row.show { display: grid; }
        .foot { margin-top: 8px; color: var(--dim); font-size: 12px; }
        .foot a { color: var(--muted); }
        @media (max-width: 640px) {
            header { flex-direction: column; }
            .meta { align-items: flex-start; text-align: left; }
            .compose, .auth-row { grid-template-columns: 1fr; }
            .row { grid-template-columns: 1fr; }
            .actions { justify-content: flex-start; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div>
                <div class="brand">Wasup · Harley</div>
                <h1>Live handoffs</h1>
                <p class="sub">Pause / resume AI. Numbers from recent chats. WhatsApp stays connected.</p>
            </div>
            <div class="meta">
                <span class="live">Live</span>
                <span id="updated">—</span>
            </div>
        </header>

        <div class="error" id="error"></div>
        <div class="auth-row" id="auth-row">
            <input type="password" id="api-key" placeholder="API key (if required)" autocomplete="off">
            <button class="btn-ghost" id="save-key" type="button">Save</button>
        </div>

        <div class="status-bar">
            <span class="pill" id="conn-pill">…</span>
            <span class="pill" id="ai-pill">…</span>
            <span class="detail" id="phone-label">—</span>
            <span class="spacer"></span>
            <button class="btn-ghost" id="refresh-btn" type="button">Refresh</button>
            <button class="btn-danger" id="ai-toggle" type="button">AI off</button>
        </div>

        <section>
            <div class="section-head">
                <h2>Paused now</h2>
                <span class="count" id="paused-count">0</span>
            </div>
            <div class="list" id="paused-list"><div class="empty">Loading…</div></div>
            <div style="margin-top:10px;display:flex;justify-content:flex-end;">
                <button class="btn-danger" id="clear-all" type="button" disabled>Resume all</button>
            </div>
        </section>

        <section>
            <div class="section-head"><h2>Pause a number</h2></div>
            <div class="compose">
                <input type="text" id="phone-input" placeholder="+44 7931 233814" autocomplete="tel">
                <button class="btn-pause" id="pause-btn" type="button">Pause AI</button>
            </div>
        </section>

        <section>
            <div class="section-head">
                <h2>Recent chats</h2>
                <span class="count" id="recent-count">0</span>
            </div>
            <div class="list" id="recent-list"><div class="empty">Waiting…</div></div>
        </section>

        <p class="foot">Worker: wasup2 · instance locked to Harley · <a href="https://wasup2.northeurope.cloudapp.azure.com/" target="_blank" rel="noopener">control plane</a></p>
    </div>

    <script>
        const API_BASE = 'https://wasup2.northeurope.cloudapp.azure.com';
        const INSTANCE_ID = 'wa_ms4nkrz1_gg1rx';
        const HARLEY_WEBHOOK = 'https://n8n-rapid-czbff9cnafhkhmhf.eastus-01.azurewebsites.net/webhook/harley-st';
        const API_KEY_STORAGE_KEY = 'wasup_api_key';
        const REFRESH_MS = 4000;

        const el = {
            error: document.getElementById('error'),
            authRow: document.getElementById('auth-row'),
            apiKey: document.getElementById('api-key'),
            saveKey: document.getElementById('save-key'),
            updated: document.getElementById('updated'),
            connPill: document.getElementById('conn-pill'),
            aiPill: document.getElementById('ai-pill'),
            phoneLabel: document.getElementById('phone-label'),
            refreshBtn: document.getElementById('refresh-btn'),
            aiToggle: document.getElementById('ai-toggle'),
            pausedList: document.getElementById('paused-list'),
            pausedCount: document.getElementById('paused-count'),
            recentList: document.getElementById('recent-list'),
            recentCount: document.getElementById('recent-count'),
            phoneInput: document.getElementById('phone-input'),
            pauseBtn: document.getElementById('pause-btn'),
            clearAll: document.getElementById('clear-all'),
        };

        let paused = [];
        let aiOn = false;
        let busy = false;
        let timer = null;

        function getApiKey() {
            try { return localStorage.getItem(API_KEY_STORAGE_KEY) || ''; } catch (_) { return ''; }
        }
        function setApiKey(v) {
            try {
                if (v) localStorage.setItem(API_KEY_STORAGE_KEY, v);
                else localStorage.removeItem(API_KEY_STORAGE_KEY);
            } catch (_) {}
        }
        function headers(json = false) {
            const h = {};
            if (json) h['Content-Type'] = 'application/json';
            const key = getApiKey();
            if (key) h['X-API-Key'] = key;
            return h;
        }
        function showError(msg) {
            if (!msg) { el.error.classList.remove('show'); el.error.textContent = ''; return; }
            el.error.textContent = msg;
            el.error.classList.add('show');
        }
        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function normalizePhone(raw) {
            if (!raw) return '';
            let s = String(raw).trim();
            const jid = s.match(/^(\d{6,15})@(?:s\.whatsapp\.net|lid|c\.us)\b/i);
            if (jid) return jid[1];
            const link = s.match(/(?:wa\.me\/|phone=)(\d{6,15})/i);
            if (link) return link[1];
            s = s.replace(/^[+]/, '').replace(/[\s().\-]/g, '');
            const digits = s.replace(/\D/g, '');
            return digits.length >= 6 && digits.length <= 15 ? digits : '';
        }
        function formatPhone(raw) {
            const d = normalizePhone(raw);
            if (!d) return String(raw || '').trim() || '—';
            if (d.startsWith('44') && d.length >= 12) {
                const rest = d.slice(2);
                if (rest.length === 10) return `+44 ${rest.slice(0, 4)} ${rest.slice(4, 7)} ${rest.slice(7)}`;
                return `+44 ${rest}`;
            }
            if (d.startsWith('1') && d.length === 11) return `+1 (${d.slice(1, 4)}) ${d.slice(4, 7)}-${d.slice(7)}`;
            const m = d.match(/^(\d{1,3})(\d+)$/);
            if (!m) return `+${d}`;
            return `+${m[1]} ${(m[2].match(/.{1,4}/g) || [m[2]]).join(' ')}`;
        }
        function extractPhonesFromText(text) {
            const found = new Set();
            if (!text) return found;
            const re = /(\+?\d[\d\s().\-]{6,18}\d)(?:@(?:s\.whatsapp\.net|lid|c\.us))?/gi;
            let m;
            while ((m = re.exec(text)) !== null) {
                const n = normalizePhone(m[1]);
                if (n) found.add(n);
            }
            const jidRe = /\b(\d{8,15})@(?:s\.whatsapp\.net|lid|c\.us)\b/gi;
            while ((m = jidRe.exec(text)) !== null) found.add(m[1]);
            return found;
        }
        function relativeTime(iso) {
            if (!iso) return '';
            const sec = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
            if (Number.isNaN(sec)) return '';
            if (sec < 10) return 'just now';
            if (sec < 60) return `${sec}s ago`;
            if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
            if (sec < 86400) return `${Math.floor(sec / 3600)}h ago`;
            return `${Math.floor(sec / 86400)}d ago`;
        }
        function isPaused(phone) {
            return paused.some((c) => normalizePhone(c.phone || c.jid) === phone);
        }

        async function api(path, options = {}) {
            const res = await fetch(`${API_BASE}${path}`, {
                ...options,
                headers: { ...headers(!!options.body), ...(options.headers || {}) },
            });
            let data = null;
            try { data = await res.json(); } catch (_) {}
            if (!res.ok) {
                const err = new Error(data?.message || data?.error || `${res.status} ${res.statusText}`);
                err.status = res.status;
                throw err;
            }
            return data;
        }

        function renderStatus(inst) {
            const connected = (inst?.status || '') === 'connected';
            el.connPill.textContent = connected ? 'Connected' : (inst?.status || 'Unknown');
            el.connPill.className = `pill ${connected ? 'conn' : 'down'}`;
            aiOn = !!(inst?.webhookUrl);
            el.aiPill.textContent = aiOn ? 'AI on' : 'AI off';
            el.aiPill.className = `pill ${aiOn ? 'on' : 'off'}`;
            el.aiToggle.textContent = aiOn ? 'Turn AI off' : 'Turn AI on';
            el.aiToggle.className = aiOn ? 'btn-danger' : 'btn-resume';
            const phone = inst?.connectedPhone || inst?.phoneNumber || '';
            el.phoneLabel.textContent = phone ? formatPhone(phone) : INSTANCE_ID;
        }

        function renderPaused() {
            const rows = paused.map((chat) => ({
                phone: normalizePhone(chat.phone || chat.jid),
                taggedAt: chat.taggedAt,
                taggedBy: chat.taggedBy,
                lastActivity: chat.lastActivity,
            })).filter((r) => r.phone).sort((a, b) => new Date(b.lastActivity || b.taggedAt || 0) - new Date(a.lastActivity || a.taggedAt || 0));

            el.pausedCount.textContent = String(rows.length);
            el.clearAll.disabled = rows.length === 0;
            if (!rows.length) {
                el.pausedList.innerHTML = '<div class="empty">No handoffs — AI answering everyone</div>';
                return;
            }
            el.pausedList.innerHTML = rows.map((r) => `
                <div class="row">
                    <div>
                        <div class="phone">
                            <a href="https://wa.me/${r.phone}" target="_blank" rel="noopener">${escapeHtml(formatPhone(r.phone))}</a>
                            <span class="badge paused">Paused</span>
                        </div>
                        <div class="detail">
                            <span>${escapeHtml(r.taggedBy || 'handoff')}</span>
                            <span>${escapeHtml(relativeTime(r.lastActivity || r.taggedAt) || '—')}</span>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-resume" data-resume="${escapeHtml(r.phone)}" type="button">Resume AI</button>
                    </div>
                </div>`).join('');
        }

        function renderRecent(items) {
            el.recentCount.textContent = String(items.length);
            if (!items.length) {
                el.recentList.innerHTML = '<div class="empty">No recent numbers yet</div>';
                return;
            }
            el.recentList.innerHTML = items.map((r) => {
                const pausedNow = isPaused(r.phone);
                const action = pausedNow
                    ? `<button class="btn-resume" data-resume="${escapeHtml(r.phone)}" type="button">Resume</button>`
                    : `<button class="btn-pause" data-pause="${escapeHtml(r.phone)}" type="button">Pause</button>`;
                return `
                <div class="row">
                    <div>
                        <div class="phone">
                            <a href="https://wa.me/${r.phone}" target="_blank" rel="noopener">${escapeHtml(formatPhone(r.phone))}</a>
                            ${pausedNow ? '<span class="badge paused">Paused</span>' : ''}
                        </div>
                        <div class="detail">
                            <span>${escapeHtml(r.hint || 'chat')}</span>
                            <span>${escapeHtml(relativeTime(r.at) || '—')}</span>
                        </div>
                    </div>
                    <div class="actions">${action}</div>
                </div>`;
            }).join('');
        }

        async function loadRecent() {
            const seen = new Map();
            const absorb = (phone, at, hint) => {
                const n = normalizePhone(phone);
                if (!n || n.length < 8) return;
                const ts = at ? new Date(at).getTime() : 0;
                const prev = seen.get(n);
                if (prev && prev._ts >= ts) return;
                seen.set(n, { phone: n, at, hint, _ts: ts });
            };
            try {
                const msgData = await api(`/api/instances/${INSTANCE_ID}/messages?limit=80`);
                for (const m of msgData.messages || []) {
                    absorb(m.direction === 'outbound' ? m.to : m.from, m.timestamp, m.direction || 'chat');
                }
            } catch (_) {}
            try {
                const logData = await api(`/api/instances/${INSTANCE_ID}/logs?limit=120`);
                for (const entry of logData.logs || []) {
                    const msg = entry.message || '';
                    let hint = 'log';
                    if (/handoff/i.test(msg)) hint = 'handoff log';
                    else if (/replied to/i.test(msg)) hint = 'reply';
                    else if (/webhook/i.test(msg)) hint = 'webhook';
                    for (const p of extractPhonesFromText(msg)) absorb(p, entry.timestamp, hint);
                }
            } catch (_) {}
            return [...seen.values()].sort((a, b) => b._ts - a._ts).slice(0, 40).map(({ _ts, ...r }) => r);
        }

        async function refresh() {
            if (busy) return;
            busy = true;
            el.refreshBtn.disabled = true;
            try {
                showError('');
                const list = await api('/api/instances');
                const instances = list.instances || [];
                const inst = instances.find((i) => i.id === INSTANCE_ID) || null;
                if (!inst) throw new Error('Harley instance not found on wasup2');
                renderStatus(inst);

                const ho = await api(`/api/instances/${INSTANCE_ID}/handoff`);
                paused = ho.humanModeChats || [];
                renderPaused();
                renderRecent(await loadRecent());
                el.updated.textContent = new Date().toLocaleTimeString();
            } catch (err) {
                if (err.status === 401) {
                    el.authRow.classList.add('show');
                    showError('API key required.');
                } else {
                    showError(err.message || 'Refresh failed');
                }
            } finally {
                busy = false;
                el.refreshBtn.disabled = false;
            }
        }

        async function setHandoff(phone, active) {
            const n = normalizePhone(phone);
            if (!n) { showError('Could not parse that phone number'); return; }
            try {
                showError('');
                await api(`/api/instances/${INSTANCE_ID}/handoff`, {
                    method: 'POST',
                    body: JSON.stringify({ phone: n, active: !!active }),
                });
                await refresh();
            } catch (err) {
                showError(err.message || 'Handoff update failed');
            }
        }

        async function toggleAi() {
            try {
                showError('');
                if (aiOn) {
                    if (!confirm('Turn AI off for Harley? WhatsApp stays connected.')) return;
                    await api(`/api/instances/${INSTANCE_ID}`, {
                        method: 'PUT',
                        body: JSON.stringify({ webhookUrl: '' }),
                    });
                } else {
                    await api(`/api/instances/${INSTANCE_ID}`, {
                        method: 'PUT',
                        body: JSON.stringify({ webhookUrl: HARLEY_WEBHOOK }),
                    });
                }
                await refresh();
            } catch (err) {
                showError(err.message || 'AI toggle failed');
            }
        }

        el.apiKey.value = getApiKey();
        el.saveKey.addEventListener('click', () => { setApiKey(el.apiKey.value.trim()); showError(''); refresh(); });
        el.refreshBtn.addEventListener('click', () => refresh());
        el.aiToggle.addEventListener('click', () => toggleAi());
        el.clearAll.addEventListener('click', async () => {
            if (!confirm('Resume AI for every paused chat?')) return;
            try {
                await api(`/api/instances/${INSTANCE_ID}/handoff`, { method: 'DELETE' });
                await refresh();
            } catch (err) {
                showError(err.message || 'Clear failed');
            }
        });
        el.pauseBtn.addEventListener('click', async () => {
            await setHandoff(el.phoneInput.value, true);
            el.phoneInput.value = '';
        });
        el.phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.pauseBtn.click(); });
        el.phoneInput.addEventListener('blur', () => {
            const n = normalizePhone(el.phoneInput.value);
            if (n) el.phoneInput.value = formatPhone(n);
        });
        document.addEventListener('click', (e) => {
            const resume = e.target.closest('[data-resume]');
            if (resume) { setHandoff(resume.getAttribute('data-resume'), false); return; }
            const pause = e.target.closest('[data-pause]');
            if (pause) setHandoff(pause.getAttribute('data-pause'), true);
        });

        refresh();
        timer = setInterval(refresh, REFRESH_MS);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { if (timer) { clearInterval(timer); timer = null; } }
            else if (!timer) { refresh(); timer = setInterval(refresh, REFRESH_MS); }
        });
    </script>
</body>
</html>
