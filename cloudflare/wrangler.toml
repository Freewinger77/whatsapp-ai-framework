# WhatsApp AI Chatbot - Cloudflare Worker Configuration
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "whatsapp-ai-chatbot"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "d963976ba2bd7eca62f769ccff551737"

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Environment variables (non-sensitive)
# Sensitive vars should be set via `wrangler secret put`
[vars]
BOT_NAME = "AI Assistant"
SUPPORTED_TOPICS = "products, pricing, support, FAQs"
DEFAULT_LANGUAGE = "en"
AI_PAUSE_DEFAULT_MINUTES = "15"
LLM_PROVIDER = "openai"  # or "gemini"

# KV Namespace for conversation memory
# Create with: npx wrangler kv:namespace create CHAT_MEMORY
# Then add the ID below
[[kv_namespaces]]
binding = "CHAT_MEMORY"
id = "abc64c0724a242afbed3331fe682465a"

# D1 Database for agent states and escalations
# Create with: npx wrangler d1 create whatsapp-bot-db
# Then add the ID below
[[d1_databases]]
binding = "DB"
database_name = "whatsapp-bot-db"
database_id = "022074a4-ef5a-49c8-a4e9-6ff9cc801258"

# R2 Bucket for content storage (used by AutoRAG)
# Create with: npx wrangler r2 bucket create content-bucket
[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "content-bucket"

# AI binding for AutoRAG and Workers AI
[ai]
binding = "AI"

# Observability (optional but recommended)
[observability]
enabled = true

# Build settings
[build]
command = "npm run build"

# Production environment overrides
[env.production]
vars = { ENVIRONMENT = "production" }

# Staging environment overrides
[env.staging]
vars = { ENVIRONMENT = "staging" }

# =============================================================================
# SECRETS (set via CLI, not in this file!)
# =============================================================================
# Run these commands to set secrets:
#
# npx wrangler secret put EVOLUTION_API_URL
# npx wrangler secret put EVOLUTION_API_KEY
# npx wrangler secret put EVOLUTION_INSTANCE_NAME
# npx wrangler secret put OPENAI_API_KEY
# npx wrangler secret put GEMINI_API_KEY
# npx wrangler secret put TELEGRAM_BOT_TOKEN
# npx wrangler secret put TELEGRAM_AGENT_CHAT_ID
# npx wrangler secret put AUTORAG_NAME
# =============================================================================
