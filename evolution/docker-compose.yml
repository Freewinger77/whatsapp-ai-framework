# Evolution API - Docker Compose Configuration
# This should be deployed on a SEPARATE PC/SERVER (not the same as development)
#
# Instructions:
# 1. Copy this file and .env.example to your server
# 2. Rename .env.example to .env and fill in the values
# 3. Run: docker-compose up -d
# 4. Access the API at: http://your-server-ip:8080
#
# Documentation: https://doc.evolution-api.com/

version: "3.8"

services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Server Configuration
      - SERVER_URL=${SERVER_URL:-http://localhost:8080}
      - SERVER_PORT=8080

      # Authentication
      - AUTHENTICATION_API_KEY=${API_KEY:-your-secret-api-key}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # Database (using SQLite for simplicity)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=sqlite
      - DATABASE_CONNECTION_URI=file:./data/evolution.db

      # Redis (optional but recommended for production)
      # - REDIS_ENABLED=true
      # - REDIS_URI=redis://redis:6379

      # Webhook Configuration (IMPORTANT: Set this to your Cloudflare Worker URL)
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${WEBHOOK_URL:-https://your-worker.your-subdomain.workers.dev/webhook}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true

      # Instance Configuration
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API
      - CONFIG_SESSION_PHONE_NAME=Chrome

      # Logging
      - LOG_LEVEL=WARN
      - LOG_COLOR=true

      # Storage
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UP=true
      - STORE_CONTACTS=true
      - STORE_CHATS=true

      # Clean old messages (optional)
      - CLEAN_STORE_CLEANING_INTERVAL=7200
      - CLEAN_STORE_MESSAGES=true
      - CLEAN_STORE_MESSAGE_UP=true
      - CLEAN_STORE_CONTACTS=false
      - CLEAN_STORE_CHATS=false

    volumes:
      - evolution_data:/evolution/data
      - evolution_instances:/evolution/instances

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Redis for better performance in production
  # redis:
  #   image: redis:7-alpine
  #   container_name: evolution-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --appendonly yes

volumes:
  evolution_data:
  evolution_instances:
  # redis_data:

# Network (optional, for multi-container setups)
networks:
  default:
    name: evolution-network
