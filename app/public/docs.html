<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasup API Documentation</title>
    <meta name="description" content="API documentation for the Wasup multi-instance WhatsApp platform">
    <style>
        :root {
            --bg: #09090b;
            --panel: #18181b;
            --border: #27272a;
            --text: #e4e4e7;
            --muted: #a1a1aa;
            --accent: #22c55e;
            --err: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .top {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.25rem 0;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
        }
        .panel h1 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
        }
        .panel p { margin: 0.35rem 0; color: var(--muted); font-size: 0.875rem; line-height: 1.5; }
        .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; margin-top: 0.75rem; }
        label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
        input[type="text"] {
            width: min(100%, 280px);
            padding: 0.5rem 0.65rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #09090b;
            color: var(--text);
            font-size: 0.875rem;
        }
        a.button {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #052e16;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
        }
        a.button.secondary { background: #3f3f46; color: var(--text); }
        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            background: #09090b;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0.5rem 0 0;
        }
        .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
        #scalar-wrap { min-height: 60vh; }
    </style>
</head>
<body>
    <div class="top">
        <div class="panel" id="auth-panel">
            <h1>This deployment</h1>
            <p><strong>Base URL</strong> for API calls on this tab: <span class="mono" style="display:inline;padding:0.15rem 0.4rem;border-radius:4px;" id="base-display"></span></p>
            <p>All <code>/api/...</code> routes expect <code>X-API-Key</code> or <code>Authorization: Bearer &lt;key&gt;</code>. Copy your org <code>sk-prod...</code> or <code>sk-dev...</code> key from the Wasup dashboard Connection page; this worker page never reveals deployment secrets.</p>
            <div class="actions">
                <a class="button" href="/test">Open test console</a>
                <a class="button secondary" href="/api/openapi.yaml" target="_blank" rel="noreferrer">OpenAPI YAML</a>
            </div>
        </div>
    </div>
    <div id="scalar-wrap">
        <script id="api-reference" data-url="/api/openapi.yaml" data-configuration='{"theme":"kepler","darkMode":true,"hiddenClients":true,"defaultHttpClient":{"targetKey":"shell","clientKey":"curl"}}'></script>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
        (function () {
            const base = window.location.origin;
            document.getElementById('base-display').textContent = base;
        })();
    </script>
</body>
</html>
