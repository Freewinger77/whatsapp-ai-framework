<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasup API Documentation</title>
    <meta name="description" content="API documentation for the Wasup multi-instance WhatsApp platform">
    <style>
        :root {
            --bg: #09090b;
            --panel: #18181b;
            --border: #27272a;
            --text: #e4e4e7;
            --muted: #a1a1aa;
            --accent: #22c55e;
            --err: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .top {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.25rem 0;
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
        }
        .nav a {
            color: var(--accent);
            text-decoration: none;
        }
        .nav a:hover { text-decoration: underline; }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
        }
        .panel h1 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
        }
        .panel p { margin: 0.35rem 0; color: var(--muted); font-size: 0.875rem; line-height: 1.5; }
        .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; margin-top: 0.75rem; }
        label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
        input[type="password"], input[type="text"] {
            width: min(100%, 280px);
            padding: 0.5rem 0.65rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #09090b;
            color: var(--text);
            font-size: 0.875rem;
        }
        button {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #052e16;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary { background: #3f3f46; color: var(--text); }
        .err { color: var(--err); font-size: 0.8rem; margin-top: 0.5rem; }
        .ok { color: var(--accent); font-size: 0.8rem; margin-top: 0.5rem; }
        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            background: #09090b;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0.5rem 0 0;
        }
        .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
        #scalar-wrap { min-height: 60vh; }
    </style>
</head>
<body>
    <div class="top">
        <nav class="nav">
            <a href="/">Dashboard</a>
            <a href="/playground">Playground</a>
            <a href="/api/openapi.yaml" target="_blank" rel="noreferrer">OpenAPI YAML</a>
        </nav>
        <div class="panel" id="auth-panel">
            <h1>This deployment</h1>
            <p><strong>Base URL</strong>: <span class="mono" style="display:inline;padding:0.15rem 0.4rem;border-radius:4px;" id="base-display"></span></p>
            <p>Use deployment <code>X-API-Key</code> for admin access, or per-instance <code>wsp_v3_*</code> keys for scoped calls. Open workers skip auth when no <code>API_KEY</code> is configured.</p>
            <div class="row" id="unlock-row">
                <div>
                    <label for="doc-pw">Reveal key password</label>
                    <input type="password" id="doc-pw" autocomplete="off" placeholder="Docs reveal password">
                </div>
                <button type="button" id="btn-unlock">Reveal API key</button>
            </div>
            <div id="unlock-msg"></div>
            <div id="secret-block" style="display:none;">
                <p style="margin-top:0.75rem"><strong>Deployment API key</strong></p>
                <div class="mono" id="api-key-display"></div>
                <div class="actions">
                    <button type="button" class="secondary" id="btn-copy-key">Copy key</button>
                    <button type="button" class="secondary" id="btn-copy-curl-list">Copy curl (list instances)</button>
                    <button type="button" class="secondary" id="btn-copy-curl-send">Copy curl (send message)</button>
                </div>
                <p class="mono" id="curl-list" style="margin-top:0.75rem"></p>
                <p class="mono" id="curl-send"></p>
            </div>
        </div>
    </div>
    <div id="scalar-wrap">
        <script id="api-reference" data-url="/api/openapi.yaml" data-configuration='{"theme":"kepler","darkMode":true}'></script>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
        (function () {
            const base = window.location.origin;
            document.getElementById('base-display').textContent = base;

            const pw = document.getElementById('doc-pw');
            const btn = document.getElementById('btn-unlock');
            const msg = document.getElementById('unlock-msg');
            const secret = document.getElementById('secret-block');
            const keyEl = document.getElementById('api-key-display');
            const curlList = document.getElementById('curl-list');
            const curlSend = document.getElementById('curl-send');
            const unlockRow = document.getElementById('unlock-row');

            let unlockedKey = '';

            fetch('/api/docs/config').then(r => r.json()).then(cfg => {
                if (!cfg.unlockEnabled) {
                    unlockRow.style.display = 'none';
                    if (!cfg.apiKeyConfigured) {
                        setMsg('Open deployment — no API key required.', false);
                    } else {
                        setMsg('Key reveal disabled. Set DOCS_REVEAL_PASSWORD or ADMIN_PASSWORD on the server.', false);
                    }
                }
            }).catch(() => {});

            function setMsg(text, isErr) {
                msg.textContent = text || '';
                msg.className = text ? (isErr ? 'err' : 'ok') : '';
            }

            btn.addEventListener('click', async function () {
                setMsg('');
                btn.disabled = true;
                try {
                    const r = await fetch('/api/docs/unlock', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pw.value }),
                    });
                    const data = await r.json().catch(function () { return {}; });
                    if (!r.ok) {
                        setMsg(data.error || 'Unlock failed', true);
                        secret.style.display = 'none';
                        return;
                    }
                    unlockedKey = data.apiKey || '';
                    keyEl.textContent = unlockedKey || '(no API_KEY on this server — open access)';
                    const b = data.baseUrl || base;
                    curlList.textContent = 'curl -sS -H "X-API-Key: ' + (unlockedKey || 'YOUR_KEY') + '" "' + b + '/api/instances"';
                    curlSend.textContent = 'curl -sS -X POST "' + b + '/api/instances/INSTANCE_ID/send" \\\n  -H "X-API-Key: ' + (unlockedKey || 'YOUR_KEY') + '" -H "Content-Type: application/json" \\\n  -d \'{"to":"60123456789","message":"Hello"}\'';
                    secret.style.display = 'block';
                    setMsg('Unlocked for this tab only.', false);
                } catch (e) {
                    setMsg(e.message || 'Network error', true);
                } finally {
                    btn.disabled = false;
                }
            });

            function copy(t) {
                if (!t) return;
                navigator.clipboard.writeText(t).catch(function () {});
            }

            document.getElementById('btn-copy-key').addEventListener('click', function () { copy(unlockedKey); });
            document.getElementById('btn-copy-curl-list').addEventListener('click', function () { copy(curlList.textContent); });
            document.getElementById('btn-copy-curl-send').addEventListener('click', function () { copy(curlSend.textContent); });
        })();
    </script>
</body>
</html>
