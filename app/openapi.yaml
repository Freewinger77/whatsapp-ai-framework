                    maxPerMinute:
                      type: integer
                      example: 12
                    maxPerHour:
                      type: integer
                      example: 250
                    maxPerDay:
                      type: integer
                      example: 4000
                    minDelayMs:
                      type: integer
                      example: 1500
                    maxDelayMs:
                      type: integer
                      example: 5000
                modules:
                  type: object
                  description: Per-module enable/disable flags
                  properties:
                    warmup:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                    replyRatio:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                    contactGraph:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                    presence:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        circadianProfile:
                          type: string
                          enum:
                            - default
                            - nightOwl
                            - earlyBird
                            - always_on
                        timezone:
                          type: string
                          example: Europe/London
                    retryTracker:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                    reconnectThrottle:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                    contactMapping:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                    sessionStability:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                    stealthConnect:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                alertsWebhook:
                  type: string
                  nullable: true
                  description: Optional webhook URL fired on risk transitions (Telegram-/Discord-compatible JSON)
      responses:
        "200":
          description: Updated
  /api/instances/{instanceId}/antiban-v2/health:
    get:
      tags:
        - Wasup Anti-Ban
      summary: Compact health (risk + score)
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Risk
          content:
            application/json:
              schema:
                type: object
                properties:
                  health:
                    type: object
                    properties:
                      risk:
                        type: string
                        enum:
                          - low
                          - medium
                          - high
                          - critical
                      score:
                        type: integer
                      recommendation:
                        type: string
                      isPaused:
                        type: boolean
      description: "**Health scores and recent warnings** from Anti-Ban v2 monitors for this instance."
  /api/instances/{instanceId}/antiban-v2/warmup:
    get:
      tags:
        - Wasup Anti-Ban
      summary: Warmup state (day x/7)
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Warmup
          content:
            application/json:
              schema:
                type: object
                properties:
                  warmup:
                    type: object
                    properties:
                      phase:
                        type: string
                        enum:
                          - warming
                          - graduated
                      day:
                        type: integer
                        example: 4
                      totalDays:
                        type: integer
                        example: 7
                      todayLimit:
                        type: integer
                        example: 117
                      todaySent:
                        type: integer
                        example: 23
                      progress:
                        type: integer
                        example: 57
                      complete:
                        type: boolean
  /api/instances/{instanceId}/antiban-v2/lid-mappings:
    get:
      tags:
        - Wasup Anti-Ban
      summary: LID↔PN cache snapshot
      description: "**Inspect contact id mappings** maintained for reliable delivery (internal troubleshooting; most integrations can ignore)."
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mappings
  /api/instances/{instanceId}/antiban-v2/pause:
    post:
      tags:
        - Wasup Anti-Ban
      summary: Emergency pause
      description: "**Temporarily pause Anti-Ban v2 enforcement** for maintenance or testing — use with caution."
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Paused
  /api/instances/{instanceId}/antiban-v2/resume:
    post:
      tags:
        - Wasup Anti-Ban
      summary: Resume after pause
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resumed
      description: "**Resume Anti-Ban v2 enforcement** after a manual pause."
  /api/instances/{instanceId}/antiban-v2/reset:
    post:
      tags:
        - Wasup Anti-Ban
      summary: Nuclear reset
      description: "**Reset Anti-Ban v2 counters and state files** for this instance to defaults."
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reset
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    instanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
      description: Instance ID
      example: wa_lxyz123_abc45
  schemas:
    SendLink:
      oneOf:
        - type: string
          format: uri
          example: https://example.com/booking
        - type: object
          required:
            - url
          properties:
            url:
              type: string
              format: uri
              example: https://example.com/booking
            label:
              type: string
              example: Booking page
    CtaUrl:
      description: Native call-to-action URL button shown below the message body.
      oneOf:
        - type: string
          format: uri
          example: https://example.com/book
        - type: object
          required:
            - url
          properties:
            url:
              type: string
              format: uri
              example: https://example.com/book
            label:
              type: string
              maxLength: 25
              example: Book now
    QuickReplyButtons:
      type: array
      maxItems: 3
      items:
        type: object
        required:
          - id
          - text
        properties:
          id:
            type: string
            maxLength: 256
            example: pricing
          text:
            type: string
            maxLength: 20
            example: Pricing
    InteractiveSendRequest:
      type: object
      required:
        - to
      properties:
        to:
          type: string
          example: "60123456789"
        message:
          type: string
          example: Choose an option.
        text:
          type: string
          example: Choose an option.
        link:
          $ref: "#/components/schemas/SendLink"
        ctaUrl:
          $ref: "#/components/schemas/CtaUrl"
        buttons:
          $ref: "#/components/schemas/QuickReplyButtons"
        linkPreview:
          type: boolean
          default: true
        footer:
          type: string
          example: Wasup API
        typingSimulation:
          type: boolean
        delayEnabled:
          type: boolean
        skipContactSave:
          type: boolean
    SendMessageBody:
      type: object
      required:
        - to
      properties:
        to:
          type: string
          description: Recipient phone number (with country code, no + or spaces) or phone or chat id
          example: "60123456789"
        message:
          type: string
          description: Text body or caption (required for text type, optional caption for media)
          example: Hello! How can I help you today?
        text:
          type: string
          description: Alias for `message`; useful for concise interactive button payloads
          example: Choose an option
        messageType:
          type: string
          description: Type of message to send. If omitted, `buttons` implies `buttons` and `sections` implies `list`.
          enum:
            - text
            - image
            - video
            - document
            - audio
            - buttons
            - list
            - location
            - contact
          default: text
          example: text
        mediaUrl:
          type: string
          description: Direct URL to media file (required for image/video/document/audio)
          example: https://example.com/photo.jpg
        mimeType:
          type: string
          description: MIME type for document/audio
          example: application/pdf
        fileName:
          type: string
          description: File name for document messages
          example: report.pdf
        ptt:
          type: boolean
          description: Send audio as voice note (push-to-talk). Default true.
          default: true
        footer:
          type: string
          description: Footer text for button and list messages
          example: Powered by WhatsApp AI
        link:
          $ref: "#/components/schemas/SendLink"
        ctaUrl:
          $ref: "#/components/schemas/CtaUrl"
        linkPreview:
          type: boolean
          default: true
          description: When true with `link`, WhatsApp renders a rich URL preview card.
        buttons:
          type: array
          description: |
            Quick-reply buttons. Set `messageType=buttons`, or omit `messageType`
            and include this array. Native WhatsApp clients generally support up
            to 3 quick-reply buttons; button titles are capped at 20 characters.
          items:
            type: object
            properties:
              id:
                type: string
                example: btn_yes
              text:
                type: string
                example: Yes
          example:
            - id: yes
              text: Yes, proceed
            - id: no
              text: No thanks
            - id: later
              text: Maybe later
        title:
          type: string
          description: Title for list messages
          example: Our Services
        buttonText:
          type: string
          description: Menu button label for list messages
          default: Menu
          example: View Options
        sections:
          type: array
          description: |
            List sections (messageType=list). Rendered as a single-select native flow
            via Wasup's interactive helper.
          items:
            type: object
            properties:
              title:
                type: string
                example: Services
              rows:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                      example: Consulting
                    id:
                      type: string
                      example: consulting
                    description:
                      type: string
                      example: Expert advice
        latitude:
          type: number
          format: double
          description: Latitude for location messages
          example: 3.1577
        longitude:
          type: number
          format: double
          description: Longitude for location messages
          example: 101.7117
        locationName:
          type: string
          description: Location name for location messages
          example: Petronas Twin Towers
        locationAddress:
          type: string
          description: Address for location messages
          example: KLCC, Kuala Lumpur
        contactCard:
          type: object
          description: Contact card details (for messageType=contact)
          properties:
            displayName:
              type: string
              example: John Doe
            phoneNumber:
              type: string
              example: "+60123456789"
        typingSimulation:
          type: boolean
          description: Override instance typing simulation setting for this message
        delayEnabled:
          type: boolean
          description: Override instance human-delay setting for this message
        contactName:
          type: string
          description: Name for auto-saving contact before sending
          example: Unknown User
        skipContactSave:
          type: boolean
          description: Skip auto-saving recipient as a contact
          default: false
    ReactionBody:
      type: object
      required:
        - to
        - messageId
        - emoji
      properties:
        to:
          type: string
          description: Recipient phone number or phone or chat id (for instance-scoped endpoint)
          example: "447835156367"
        to_phone:
          type: string
          description: Recipient phone number (for auto-select endpoint)
          example: "447835156367"
        messageId:
          type: string
          description: |
            WhatsApp message id to react to. Obtain from the `message_id` field
            returned by the send endpoints or from inbound webhook payloads.
          example: 3EB0DAC5F4A2E1B7
        emoji:
          type: string
          description: Emoji to react with. Pass an empty string `""` to remove a reaction.
          example: 🔥
        fromMe:
          type: boolean
          description: |
            Set to `true` if the target message was sent by the connected account.
            Defaults to `false` (reacting to a received message).
          default: false
    HandoffSettings:
      type: object
      properties:
        resumeKeywords:
          type: array
          items:
            type: string
          description: |
            Keywords a human agent types from the phone to reactivate the AI bot
            for that chat. Matched case-insensitively at the start of the message.
          default:
            - "#ai"
            - "#assistant"
            - "#bot"
            - "#resume"
          example:
            - "#ai"
            - "#assistant"
            - "#bot"
            - "#resume"
        resumeMessage:
          type: string
          description: |
            Optional auto-reply sent when the AI agent resumes on a chat.
            Empty string means silent resume.
          default: ""
          example: AI assistant is back online. How can I help?
    OnboardResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        instanceId:
          type: string
          example: wa_abc123
        pairingCode:
          type: string
          nullable: true
          description: Pairing code to enter in WhatsApp (null if already connected)
          example: A1B2-C3D4
        status:
          type: string
          enum:
            - disconnected
            - connecting
            - connected
          example: connecting
        message:
          type: string
          example: Enter code A1B2-C3D4 in WhatsApp > Linked Devices > Link a Device
    ConnectionStatus:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          enum:
            - disconnected
            - connecting
            - connected
          example: connected
        phone:
          type: string
          nullable: true
          example: "447393002183"
        connectedAt:
          type: string
          format: date-time
          nullable: true
        uptime:
          type: integer
          nullable: true
          description: Seconds since connection was established
          example: 3600
        pairingCode:
          type: string
          nullable: true
        qrCode:
          type: string
          nullable: true
    Message:
      type: object
      properties:
        id:
          type: string
          example: 3EB0B430A7F9B1D2
        direction:
          type: string
          enum:
            - inbound
            - outbound
          example: inbound
        from:
          type: string
          description: Sender phone number
          example: "447393002183"
        to:
          type: string
          description: Recipient phone number
          example: "60123456789"
        text:
          type: string
          example: Hello, I need help with my order
        mediaUrl:
          type: string
          nullable: true
          description: |
            Public URL of the media file (image, audio, video, document, sticker)
            stored in Azure Blob Storage. Only present for media messages when
            `AZURE_STORAGE_CONNECTION_STRING` is configured.
          example: https://whatsappmediastore.blob.core.windows.net/whatsapp-media/wa_abc/image/1706000000-a1b2c3d4.jpg
        mediaType:
          type: string
          nullable: true
          enum:
            - image
            - video
            - audio
            - document
            - sticker
            - null
          description: Type of media attachment
        mimeType:
          type: string
          nullable: true
          description: MIME type of the media file
          example: image/jpeg
        fileName:
          type: string
          nullable: true
          description: Original file name (documents only)
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          example: delivered
    WebhookPayload:
      type: object
      description: |
        Payload sent to the per-instance webhook URL when a message is received.
        Your webhook should return `{ reply: "text" }` to auto-respond, or
        `{ skip: true }` to suppress the bot reply.
      properties:
        message_id:
          type: string
        created_at:
          type: string
          format: date-time
        from_phone:
          type: string
          example: "447835156367"
        to_phone:
          type: string
          example: "358942721757"
        message:
          type: string
        media_type:
          type: string
          enum:
            - text
            - image
            - video
            - audio
            - document
            - sticker
            - location
            - contact
        media_url:
          type: string
          nullable: true
          description: Public Azure Blob Storage URL of the media file (null for text)
        mime_type:
          type: string
          nullable: true
        file_name:
          type: string
          nullable: true
        status:
          type: string
          example: received
        webhook_id:
          type: string
          description: Instance ID
        event:
          type: string
          example: message
        quoted_message:
          type: string
          nullable: true
    Instance:
      type: object
      properties:
        id:
          type: string
          example: wa_lxyz123_abc45
        name:
          type: string
          example: Customer Support
        status:
          type: string
          enum:
            - disconnected
            - connecting
            - connected
          example: connected
        qrCode:
          type: string
          nullable: true
          description: Base64 QR code (only when connecting)
        pairingCode:
          type: string
          nullable: true
          description: Pairing code (only when connecting via pairing)
        connectedPhone:
          type: string
          nullable: true
          example: "60123456789"
        connectedAt:
          type: string
          format: date-time
          nullable: true
        webhookUrl:
          type: string
          example: https://your-api.com/webhook
        behaviorSettings:
          $ref: "#/components/schemas/BehaviorSettings"
        antiBanSettings:
          $ref: "#/components/schemas/AntiBanSettings"
        antiBanHealth:
          $ref: "#/components/schemas/AntiBanHealth"
        createdAt:
          type: string
          format: date-time
    BehaviorSettings:
      type: object
      properties:
        behaviorProfile:
          type: string
          enum:
            - bot-native
            - notification-balanced
            - notification-max
          description: |
            Top-level behavior mode.

            `bot-native` uses active-device automation with typing, reads, delays,
            and presence cycling.

            `notification-balanced` prioritizes handset alerts without promising
            delivery: inbound messages are logged/webhooked immediately, then
            reads/typing/replies wait for `notificationGraceMs`.

            `notification-max` maximizes handset alerts: typing is disabled and
            automated read receipts are skipped.
          default: bot-native
          example: notification-balanced
        typingSimulation:
          type: boolean
          description: |
            Show "typing..." before sending. In `notification-balanced`, typing
            happens only after the grace window. In `notification-max`, this is
            forced off.
          default: true
          example: true
        delayEnabled:
          type: boolean
          description: Add human-like delays before responding
          default: true
          example: true
        notificationGraceMs:
          type: integer
          minimum: 0
          maximum: 120000
          description: |
            Milliseconds to wait after an inbound message before read receipt,
            typing, or reply in notification profiles. The webhook/log event is
            still sent immediately.
          default: 12000
          example: 12000
        phoneNotificationsEnabled:
          type: boolean
          description: |
            Legacy compatibility flag. New clients should set `behaviorProfile`.
            When true, maps to `notification-balanced` unless typing is false,
            in which case it maps to `notification-max`.
          default: false
          example: false
    AntiBanSettings:
      type: object
      properties:
        preset:
          type: string
          enum:
            - conservative
            - balanced
            - aggressive
            - custom
          example: balanced
        messagesPerHour:
          type: integer
          example: 200
        messagesPerDay:
          type: integer
          example: 5000
        uniqueChatsPerHour:
          type: integer
          example: 50
        uniqueChatsPerDay:
          type: integer
          example: 500
    AntiBanHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - warning
            - limited
          example: healthy
        hourlyUsage:
          type: integer
          description: Percentage of hourly message limit used
          example: 25
        dailyUsage:
          type: integer
          description: Percentage of daily message limit used
          example: 10
        hourlyChatsUsage:
          type: integer
          example: 20
        dailyChatsUsage:
          type: integer
          example: 8
        warnings:
          type: array
          items:
            type: string
          example: []
        stats:
          type: object
          properties:
            messagesThisHour:
              type: integer
              example: 12
            messagesThisDay:
              type: integer
              example: 30
            uniqueChatsThisHour:
              type: integer
              example: 5
            uniqueChatsThisDay:
              type: integer
              example: 8
    SendResult:
      type: object
      properties:
        sent:
          type: boolean
          example: true
        delay:
          type: integer
          description: Delay applied in milliseconds
          example: 3500
        typingSimulation:
          type: boolean
          example: true
        delayEnabled:
          type: boolean
          example: true
        reason:
          type: string
          description: Reason if message was blocked
        waitTime:
          type: integer
          description: Time to wait before retry (if rate limited)
    LogEntry:
      type: object
      properties:
        id:
          type: string
          example: "1704825600000"
        timestamp:
          type: string
          format: date-time
        message:
          type: string
          example: Connected as 60123456789
        level:
          type: string
          enum:
            - info
            - success
            - warning
            - error
          example: success
    Error:
      type: object
      properties:
        error:
          type: string
          example: Instance not found
        details:
          type: array
          items:
            type: string
          example:
            - link.url must use http or https
            - Button 1 text must be 20 characters or fewer
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Unauthorized
              message:
                type: string
                example: Valid API key required. Use X-API-Key header or Authorization Bearer
