openapi: 3.0.3
info:
  title: WhatsApp Multi-Instance API
  description: |-
    Wasup lets you run one or more WhatsApp numbers from a single deployment. Each **instance** is an isolated number with its own pairing state, webhook, send limits, and activity logs.

    ## Who this API is for
    Integrators building bots, CRMs, booking flows, or support desks that need to **create numbers**, **pair them**, **send messages**, and **receive inbound events** over HTTPS.

    ## Authentication
    When an API key is configured, send it on every `/api/...` request:
    - Header `X-API-Key: your-key`
    - or `Authorization: Bearer your-key`

    Org-scoped keys from the Wasup dashboard Connection page are recommended. Open deployments without `API_KEY` accept unauthenticated calls (development only).

    ## Typical flow
    1. **Create** an instance (`POST /api/instances`)
    2. **Connect** and scan QR or enter a pairing code (`POST .../connect`, poll `GET .../qr`)
    3. **Set webhook** for inbound messages (`PUT .../webhook` or at create time)
    4. **Send** outbound messages (`POST .../send`)
    5. **Poll status** for delivery/read acks (`GET .../messages/{messageId}/status`)
    5. **Monitor** health and logs (`GET /api/health`, `GET .../logs`)

    ## Reconnecting & re-pairing (read this to avoid pairing failures)
    To take a number from **any** state (disconnected, dropped, corrupt auth, or previously linked) to a **fresh pairing code**, always run this exact sequence:

    1. `POST /api/instances/{id}/disconnect` — close any live/half socket
    2. `POST /api/instances/{id}/clear-auth` — wipe credentials (forces a NEW code)
    3. wait ~2s, then `POST /api/instances/{id}/connect` with `{ "phoneNumber": "447..." }`
    4. `GET /api/instances/{id}/connection` — poll every 3–5s until `status: connected`

    **Rules that prevent the common failures:**
    - Call `connect` **once** per attempt. While waiting, poll `GET .../connection` only — never re-POST connect.
    - If `connect` returns `reused: true`, the previous code (<2 min) is still valid — show the same code, do not refresh.
    - **Skipping `clear-auth`** on a previously linked number makes `connect` resume the old session and return `pairingCode: null` — no code for the user.
    - `400 "Connection Closed"` (status 428) means stale/corrupt auth — `clear-auth` then `connect` fixes it; retry connect at most once after ~4s.
    - WhatsApp app showing **"something went wrong"** = the code was rotated by repeated `connect` calls. One connect, then let the user enter the code.

    ## Interactive messages
    Use the same send endpoints for plain text, link previews, CTA URL buttons, quick-reply buttons, media, locations, and reactions. See **Messaging** and **Webhook** sections for payload shapes.

    ## Inbound webhooks
    When someone messages your linked number, Wasup POSTs JSON to your `webhookUrl`. Media messages include `media_id` and `media.downloadUrl` so you can fetch the file with `GET /api/instances/{id}/media/{mediaId}`.
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Whitelabel
    description: Single-call helpers that create, configure, and connect a number in one request — ideal for onboarding flows.
  - name: Instances
    description: Create, read, update, and delete WhatsApp instances. An instance is one linked phone number plus its settings.
  - name: Connection
    description: |-
      Start or stop the live WhatsApp session, fetch QR/pairing codes, and check whether a number is linked.

      **Bulletproof re-pair flow (use this to ALWAYS reach a fresh pairing code):**
      1. `POST .../disconnect` — close any live or half-open socket
      2. `POST .../clear-auth` — wipe saved credentials (this is what forces a NEW code)
      3. wait ~2s, then `POST .../connect` with `pairingPhone` — generates the code
      4. `GET .../connection` — poll every 3–5s until `status: connected`

      Call `connect` **once** per attempt. While polling, only call `GET .../connection` — never re-POST connect in a loop. If `connect` returns `reused: true` the previous code (<2 min old) is still valid — show the same code, do not refresh. Skipping `clear-auth` on a previously linked number makes `connect` resume the old session and return `pairingCode: null` (no code for the user).
  - name: Messaging
    description: Send text, media, buttons, lists, and reactions to customers. Auto-select routes pick the first connected instance when you omit an instance id.
  - name: Reactions
    description: Attach or remove emoji reactions on existing messages using the message id from webhooks or send responses.
  - name: Handoff
    description: Pause automated replies for specific chats while a human agent takes over the conversation.
  - name: Profile
    description: Read or update the WhatsApp display name, profile photo, and About text for a linked instance.
  - name: Webhook
    description: Configure where inbound messages are delivered and inspect the JSON shape your receiver should expect.
  - name: Behavior
    description: Control typing indicators, human-like delays, and whether the linked phone should receive push notifications before the API marks messages read.
  - name: Anti-Ban
    description: Legacy rate-limit presets and usage counters that protect a number from sending too fast.
  - name: Wasup Anti-Ban
    description: Advanced per-instance protection modules (warm-up, rate limits, health monitoring, presence timing). State is stored on disk per instance.
  - name: Logs
    description: Read recent connection and messaging activity for troubleshooting.
  - name: System
    description: Deployment health, instance roll-ups, and API key utilities.
security:
  - ApiKeyAuth: []
  - BearerAuth: []
paths:
  /api/onboard:
    post:
      tags:
        - Whitelabel
      summary: Onboard a new WhatsApp number
      description: "**Onboard a new WhatsApp number in one call.** Creates an instance (or reuses an existing one for the same phone), sets optional webhook and profile fields, starts pairing, and returns a pairing code when applicable. Use this when your product wizard should not make separate create/connect/webhook calls."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  description: Phone number with country code (+ prefix optional)
                  example: "447393002183"
                name:
                  type: string
                  description: Friendly name for the instance
                  example: Acme Corp
                webhookUrl:
                  type: string
                  format: uri
                  description: URL to forward inbound messages to
                  example: https://acme.com/webhook
                profileName:
                  type: string
                  description: WhatsApp display name (applied once connected)
                  example: Acme Support
                profileStatus:
                  type: string
                  description: WhatsApp "About" text (applied once connected)
                  example: We reply within minutes
                behaviorSettings:
                  $ref: "#/components/schemas/BehaviorSettings"
                  description: |
                    Optional behavior overrides at onboarding time. For
                    human-monitored deployments (clinics, support desks), use
                    `behaviorProfile: notification-balanced` so inbound
                    webhooks stay immediate while handset alerts are prioritized.
            examples:
              minimal:
                summary: Phone only
                value:
                  phone: "447393002183"
              full:
                summary: Full onboarding
                value:
                  phone: "447393002183"
                  name: Acme Corp
                  webhookUrl: https://acme.com/webhook
                  profileName: Acme Support
                  profileStatus: We reply within minutes
              clinic:
                summary: Clinic / human-monitored (phone notifications on)
                value:
                  phone: "447393002183"
                  name: Smile Dental
                  webhookUrl: https://wasup.co/webhook/...
                  behaviorSettings:
                    behaviorProfile: notification-balanced
                    notificationGraceMs: 12000
                    typingSimulation: true
      responses:
        "200":
          description: Instance already exists for this phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardResponse"
              example:
                success: true
                instanceId: wa_abc123
                pairingCode: null
                status: connected
                message: Instance already exists for this phone number
        "201":
          description: Instance created and pairing code generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardResponse"
              example:
                success: true
                instanceId: wa_abc123
                pairingCode: A1B2-C3D4
                status: connecting
                message: Enter code A1B2-C3D4 in WhatsApp > Linked Devices > Link a Device
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/instances:
    get:
      tags:
        - Instances
      summary: List all instances
      description: "**List every instance on this deployment.** Returns id, display name, connection status (`disconnected`, `connecting`, `connected`), linked phone when available, webhook URL, behavior settings, and anti-ban health. Use this to populate admin dashboards or to pick an instance id before sending."
      responses:
        "200":
          description: List of instances
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 2
                  instances:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instance"
    post:
      tags:
        - Instances
      summary: Create new instance
      description: "**Create a new empty instance.** Optionally set a custom id, friendly name, inbound webhook URL, behavior profile, and anti-ban preset. The number is not linked until you call `POST .../connect` and complete QR or pairing. Does not send any messages."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Custom instance ID (auto-generated if not provided)
                  example: my_custom_id
                name:
                  type: string
                  description: Display name for the instance
                  example: Customer Support
                webhookUrl:
                  type: string
                  format: uri
                  description: URL to forward incoming messages to
                  example: https://your-api.com/webhook
                behaviorSettings:
                  $ref: "#/components/schemas/BehaviorSettings"
                antiBanSettings:
                  $ref: "#/components/schemas/AntiBanSettings"
      responses:
        "201":
          description: Instance created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  instance:
                    $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/instances/{instanceId}:
    parameters:
      - $ref: "#/components/parameters/instanceId"
    get:
      tags:
        - Instances
      summary: Get instance details
      description: "**Fetch full details for one instance.** Same fields as the list endpoint plus QR state hints, connected-at timestamp, saved-credentials flag, and effective anti-ban usage. Use before sending or when showing a single number in your UI."
      responses:
        "200":
          description: Instance details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  instance:
                    $ref: "#/components/schemas/Instance"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Instances
      summary: Update instance
      description: "**Update instance settings without deleting it.** Change name, webhook URL, behavior profile (typing, delays, notification grace), and anti-ban limits. Does not disconnect an active session unless a setting requires reconnect (for example proxy changes)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Updated Name
                webhookUrl:
                  type: string
                  format: uri
                  example: https://new-webhook.com/endpoint
                behaviorSettings:
                  $ref: "#/components/schemas/BehaviorSettings"
                antiBanSettings:
                  $ref: "#/components/schemas/AntiBanSettings"
      responses:
        "200":
          description: Instance updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  instance:
                    $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Instances
      summary: Delete instance
      description: "**Permanently remove an instance.** Stops the session, deletes local credentials, logs, and stored media for that id. This cannot be undone — create a new instance to link the same phone again."
      responses:
        "200":
          description: Instance deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Instance wa_xxx deleted
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/instances/{instanceId}/connect:
    parameters:
      - $ref: "#/components/parameters/instanceId"
    post:
      tags:
        - Connection
      summary: Connect instance
      description: |-
        **Start linking this instance to WhatsApp.** Opens a pairing session. By default returns QR mode — poll `GET .../qr` and show the code to the user. Pass `pairingPhone` (or `phoneNumber`) to receive a numeric pairing code instead of QR.

        **Call this only ONCE per pairing attempt.** Do not call it again while waiting — poll `GET .../connection` instead. Re-calling rotates the code and triggers WhatsApp's "something went wrong".

        **Responses:**
        - New code → `{ pairingCode, reused: null }`
        - Code <2 min old, same phone → `{ pairingCode, reused: true }` (show the SAME code; do not refresh)
        - Number already linked / credentials still present → resumes the old session and returns `pairingCode: null`. To force a fresh code you must `clear-auth` first (see the **Bulletproof re-pair flow** in the Connection section).
        - `400 "Connection Closed"` (status 428) → corrupt/stale auth or a socket still tearing down. Fix: run `clear-auth` then `connect`; if it recurs, wait ~4s and retry connect once. Never rapid-fire connect.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pairingPhone:
                  type: string
                  description: Phone number with country code (no + prefix). If provided, uses pairing code instead of QR.
                  example: "447393002183"
      responses:
        "200":
          description: Connection started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Connection started (QR mode)
                  pairingCode:
                    type: string
                    nullable: true
                    description: Pairing code (only when pairingPhone was provided)
                    example: A1B2-C3D4
                  instance:
                    $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/instances/{instanceId}/disconnect:
    parameters:
      - $ref: "#/components/parameters/instanceId"
    post:
      tags:
        - Connection
      summary: Disconnect instance
      description: "**Close the live session locally.** Stops receiving and sending until you connect again. Saved credentials remain on disk so reconnect usually does not require a new QR. Pass `revoke: true` only when you intentionally want WhatsApp to invalidate the linked device everywhere. Idempotent — safe to call when already disconnected. Step 1 of the re-pair flow."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                revoke:
                  type: boolean
                  default: false
                  description: If true, revoke the session on WhatsApp servers (optional).
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Disconnected
                  instance:
                    $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/instances/{instanceId}/clear-auth:
    parameters:
      - $ref: "#/components/parameters/instanceId"
    post:
      tags:
        - Connection
      summary: Clear auth
      description: "**Wipe saved pairing data.** Disconnects if needed and deletes credential files, then the next `connect` ALWAYS issues a fresh QR/pairing code. This is the step that prevents the `pairingCode: null` and `428 Connection Closed` failures on a previously linked or corrupted number. Idempotent. Step 2 of the re-pair flow — run it before `connect` whenever you want the user to (re)link, regardless of current status."
      responses:
        "200":
          description: Auth cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Auth cleared
                  instance:
                    $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/instances/{instanceId}/pair:
    parameters:
      - $ref: "#/components/parameters/instanceId"
    post:
      tags:
        - Connection
      summary: Connect via pairing code
      description: "**Connect using a pairing code instead of QR.** Requires the phone number in the body. Returns a short code the user enters under WhatsApp → Linked devices. Automatically starts the connection if not already connecting."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
              properties:
                phoneNumber:
                  type: string
                  description: Phone number with country code, no + prefix
                  example: "447393002183"
      responses:
        "200":
          description: Pairing code generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  pairingCode:
                    type: string
                    example: A1B2-C3D4
                  message:
                    type: string
                    example: Enter code A1B2-C3D4 in WhatsApp > Linked Devices > Link a Device
                  instance:
                    $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/instances/{instanceId}/qr:
    parameters:
      - $ref: "#/components/parameters/instanceId"
    get:
      tags:
        - Connection
      summary: Get QR / pairing code
      description: "**Get the current QR image or pairing code.** Poll while status is `connecting`. Append `?format=image` for a raw PNG suitable for mobile apps. Returns connected phone when status is `connected`. Returns 204 when no code is ready yet — call `/connect` first."
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum:
              - image
          description: Set to `image` to receive a raw PNG instead of JSON
      responses:
        "200":
          description: QR / pairing code (JSON)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    enum:
                      - disconnected
                      - connecting
                      - connected
                    example: connecting
                  qrCode:
                    type: string
                    nullable: true
                    description: Base64 data URL of QR code image
                    example: data:image/png;base64,iVBORw0KGgo...
                  pairingCode:
                    type: string
                    nullable: true
                    description: Pairing code (if using pairing code mode)
                    example: A1B2-C3D4
                  phone:
                    type: string
                    nullable: true
                    description: Connected phone (when status is 'connected')
                  message:
                    type: string
                    example: Not yet generated. Call /connect or /pair first.
            image/png:
              schema:
                type: string
                format: binary
                description: Raw QR code PNG (when ?format=image)
        "204":
          description: No QR code available (already connected or not yet generated)
        "404":
          $ref: "#/components/responses/NotFound"
  /api/instances/{instanceId}/connection:
    parameters:
      - $ref: "#/components/parameters/instanceId"
    get:
      tags:
        - Whitelabel
        - Connection
      summary: Poll connection status
      description: "**Lightweight connection poll — use THIS while waiting to link.** Returns only status (`disconnected` | `connecting` | `connected`), phone, uptime, and the current `pairingCode` — faster than fetching the full instance object. Poll every 3–5s after `connect`; stop when `status: connected`. Never call `POST .../connect` inside the poll loop. Note: a `connecting` instance whose code is not entered will drop back to `disconnected` after ~2 min (the code expired) — re-run the re-pair flow to mint a new one."
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"
              example:
                success: true
                status: connected
                phone: "447393002183"
                connectedAt: 2026-01-29T12:00:00.000Z
                uptime: 3600
                pairingCode: null
                qrCode: null
        "404":
          $ref: "#/components/responses/NotFound"
  /api/instances/{instanceId}/send:
    parameters:
      - $ref: "#/components/parameters/instanceId"
    post:
      tags:
        - Messaging
      summary: Send message via instance
      description: "**Send an outbound WhatsApp message from this instance.** Accepts plain text, link previews, CTA URL buttons, quick replies, images, documents, audio, video, and location pins in one payload. Requires `to` (customer phone, country code, no +) and content fields. Respects anti-ban delays; blocked sends return a reason and suggested wait time."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
            examples:
              text:
                summary: Plain text
                value:
                  to: "60123456789"
                  message: Hello from Wasup
              buttons:
                summary: Interactive quick-reply buttons
                value:
                  to: "60123456789"
                  text: Choose an option
                  buttons:
                    - id: yes
                      text: Yes
                    - id: no
                      text: No
                  footer: Wasup
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageType:
                    type: string
                    example: text
                  result:
                    $ref: "#/components/schemas/SendResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/instances/{instanceId}/send/interactive:
    parameters:
      - $ref: "#/components/parameters/instanceId"
    post:
      tags:
        - Messaging
      summary: Send interactive-capable message via instance
      description: "**Same as `/send` with documentation focused on interactive payloads.** Use for button-heavy examples. Supports combining one CTA URL button with up to two quick-reply buttons (three interactive actions total)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractiveSendRequest"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  messageType:
                    type: string
                    example: native_interactive
                  result:
                    $ref: "#/components/schemas/SendResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/send:
    post:
      tags:
        - Messaging
      summary: Send message (auto-select instance)
      description: "**Send without specifying an instance id.** Wasup picks a connected instance automatically — usually matching `from_phone` when provided, otherwise the first connected instance. Same body as instance send. Fails with a clear error if no instance is connected."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SendMessageBody"
                - type: object
                  properties:
                    from_phone:
                      type: string
                      description: Your connected phone number to send from (optional, auto-selects if omitted)
                      example: "60123456789"
                    to_phone:
                      type: string
                      description: Alias for `to`
                      example: "60198765432"
            examples:
              autoSelectButtons:
                summary: Auto-select connected instance and send buttons
                value:
                  to_phone: "60123456789"
                  text: Choose an option
                  buttons:
                    - id: yes
                      text: Yes
                    - id: no
                      text: No
                  footer: Wasup
              fromPhoneButtons:
                summary: Send buttons from a specific connected phone
                value:
                  from_phone: "60111111111"
                  to_phone: "60123456789"
                  message: Choose an option
                  messageType: buttons
                  buttons:
                    - id: yes
                      text: Yes
                    - id: no
                      text: No
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    message_id:
                      type: string
                      format: uuid
                    created_at:
                      type: string
                      format: date-time
                    from_phone:
                      type: string
                    to_phone:
                      type: string
                    message:
                      type: string
                    message_type:
                      type: string
                      example: text
                    status:
                      type: string
                      enum:
                        - sent
                        - rate_limited
                        - failed
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/instances/{instanceId}/messages:
    parameters:
      - $ref: "#/components/parameters/instanceId"
    get:
      tags:
        - Whitelabel
        - Messaging
      summary: Get message history
      description: "**Search recent message history stored on the worker.** Filter by phone, direction, or text search. Useful for support consoles; primary automation should still rely on webhooks for real-time inbound events."
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - inbound
              - outbound
          description: Filter by message direction (omit for both)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Max messages to return
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Only return messages after this ISO timestamp
          example: 2026-01-29T00:00:00.000Z
      responses:
        "200":
          description: Message history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 12
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/instances/{instanceId}/react:
    parameters:
      - $ref: "#/components/parameters/instanceId"
    post:
      tags:
        - Reactions
        - Messaging
