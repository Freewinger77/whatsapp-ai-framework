apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wasup-worker.fullname" . }}
  labels:
    {{- include "wasup-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "wasup-worker.name" . }}
      wasup.ai/instance-id: {{ .Values.instanceId | quote }}
  template:
    metadata:
      labels:
        {{- include "wasup-worker.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: ORG_ID
              value: {{ .Values.orgId | quote }}
            - name: INSTANCE_ID
              value: {{ .Values.instanceId | quote }}
            - name: REGION_CODE
              value: {{ .Values.regionCode | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "wasup-worker.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
